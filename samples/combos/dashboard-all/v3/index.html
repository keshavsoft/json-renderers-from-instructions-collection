<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full Dashboard (All Components Connected) (V3)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .sample-shell {
            max-width: 1100px;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            border-radius: 14px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        /* Datalist container is purely functional in the DOM and invisible to layout */
        [data-role="datalist-container"] {
            display: none !important;
        }

        .table-primary {
            background-color: #dbeafe !important;
            font-weight: 600;
        }

        .form-card {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>
    <main class="container py-4 sample-shell">
        <div class="dashboard-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <span class="badge bg-primary px-3 py-1 mb-2">Connected Component Ecosystem</span>
                <h3 class="fw-bold mb-1">Full Dashboard &middot; Synchronized Ecosystem</h3>
                <p class="text-secondary-subtle small mb-0" style="color: #cbd5e1;">
                    Datalist Autocomplete &rarr; Form Entry &rarr; Table Selection &rarr; Live Filtering & Footer Entry
                </p>
            </div>
            <a href="../../" class="btn btn-outline-light btn-sm">&larr; Back to Combos</a>
        </div>

        <!-- Render Target Container -->
        <div id="dom-render-container"></div>
    </main>

    <script type="module" src="./index.js"></script>
</body>

</html>
