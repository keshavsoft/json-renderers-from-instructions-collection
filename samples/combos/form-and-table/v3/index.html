<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form + Table Combination (V3)</title>
    <script>
        if (!window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
            window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .sample-shell { max-width: 1100px; }
        [data-role="datalist-container"], #data-list-simple-id {
            display: none !important;
        }
        .table-primary {
            background-color: #dbeafe !important;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="container py-4 sample-shell">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge bg-primary mb-1">Combos &middot; Form & Table</span>
                <h3 class="fw-bold mb-0">Form + Table Combination <span class="badge bg-primary">V3</span></h3>
                <p class="text-muted small mb-0">Select row / "show" &rarr; Populate vertical form. Type in form &rarr; Autocomplete from hidden datalists.</p>
            </div>
            <a href="../../" class="btn btn-outline-secondary btn-sm">&larr; Back to Combos</a>
        </div>
        <div id="dom-render-container"></div>
    </main>
    <script type="module" src="./index.js"></script>
</body>
</html>
