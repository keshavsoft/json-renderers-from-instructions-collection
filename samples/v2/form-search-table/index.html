<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Form + Table Lab | Collection V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: system-ui, -apple-system, sans-serif; }
        .sample-shell { max-width: 1100px; }
        .sample-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; border-radius: 16px; }
    </style>
</head>
<body>
    <main class="container py-4 sample-shell">
        <header class="sample-header p-4 mb-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <span class="badge bg-warning text-dark px-3 py-2">
                    <i class="bi bi-stars me-1"></i> Interactive Creative Combo
                </span>
                <span class="text-white-50 small">Form Filter + Table Live Integration</span>
            </div>
            <h1 class="h3 mb-2 fw-bold">Form & Live Table Explorer</h1>
            <p class="mb-0 text-white-50">Filter by search keyword or category dropdown. The table refreshes in-place via pure baseFromSpec.</p>
        </header>

        <div id="dom-render-container"></div>

        <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
            <a href="../" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to V2 Samples Hub
            </a>
            <span class="text-muted small">Powered by spec-repo v13 (baseFromSpec)</span>
        </div>
    </main>

    <script type="module" src="./index.js"></script>
</body>
</html>
